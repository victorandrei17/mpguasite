  <script>
    /* Ano dinâmico no copyright */
    const anoEl = document.getElementById('ano-atual');
    if (anoEl) anoEl.textContent = new Date().getFullYear();

    /* Shadow no header ao rolar */
    const header = document.getElementById('site-header');
    if (header) {
      window.addEventListener('scroll', () => {
        header.classList.toggle('scrolled', window.scrollY > 60);
      }, { passive: true });
    }

    /* Hamburguer mobile */
    const burger    = document.getElementById('hamburger');
    const mobileNav = document.getElementById('mobile-nav');

    if (burger && mobileNav) {
      burger.addEventListener('click', () => {
        const isOpen = mobileNav.hasAttribute('hidden') === false
          ? mobileNav.removeAttribute('hidden') || false
          : (mobileNav.removeAttribute('hidden'), true);

        const open = burger.getAttribute('aria-expanded') !== 'true';
        burger.setAttribute('aria-expanded', String(open));
        burger.classList.toggle('open', open);

        if (open) {
          mobileNav.removeAttribute('hidden');
        } else {
          mobileNav.setAttribute('hidden', '');
        }
      });

      /* Fecha ao clicar em link interno */
      mobileNav.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          mobileNav.setAttribute('hidden', '');
          burger.classList.remove('open');
          burger.setAttribute('aria-expanded', 'false');
        });
      });

      /* Fecha com ESC */
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !mobileNav.hasAttribute('hidden')) {
          mobileNav.setAttribute('hidden', '');
          burger.classList.remove('open');
          burger.setAttribute('aria-expanded', 'false');
          burger.focus();
        }
      });
    }
  </script>
